<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Enchanted Kingdom of Sweets</title><desc id="desc">A glowing purple fantasy candy kingdom with a royal castle, crystal waterfalls, candy trees, stars and a winding magical path.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#21104d"/><stop offset=".58" stop-color="#64349a"/><stop offset="1" stop-color="#f08acb"/></linearGradient>
 <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#a45bce"/><stop offset="1" stop-color="#38206f"/></linearGradient>
 <linearGradient id="tower" x2="0" y2="1"><stop stop-color="#f5c4ff"/><stop offset=".5" stop-color="#a66be4"/><stop offset="1" stop-color="#55328d"/></linearGradient>
 <linearGradient id="path" x2="0" y2="1"><stop stop-color="#ffe9a1"/><stop offset="1" stop-color="#ff8bd4"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff7c9" stop-opacity=".9"/><stop offset="1" stop-color="#ffb8f2" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
