<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Candy Magic Royale — Full Interactive 3D Engine</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.31.2/babylon.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #120624; color: #fff;
      font-family: 'Fredoka', sans-serif;
      overflow: hidden;
    }
    .shell {
      position: relative; width: 100%; max-width: 480px; height: 100dvh;
      margin: 0 auto; overflow: hidden; background: #190933;
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.35);
    }
    #renderCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none; outline: none;
    }
    .ui-layer {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 10;
    }
    .pointer-auto { pointer-events: auto; }
    .hud-pill {
      background: rgba(20, 8, 42, 0.85);
      border: 1.5px solid rgba(251, 191, 36, 0.7);
      border-radius: 999px; padding: 4px 11px;
      font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 5px;
      backdrop-filter: blur(6px);
    }
    .gold-btn {
      background: linear-gradient(180deg, #fde047 0%, #f59e0b 100%);
      color: #451a03; border: 2px solid #fef08a;
      box-shadow: 0 4px 0 #b45309; font-weight: 700;
    }
    .gold-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b45309; }
    .green-btn {
      background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
      color: #fff; border: 2px solid #bbf7d0;
      box-shadow: 0 4px 0 #15803d; font-weight: 700;
    }
    .green-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #15803d; }
    .royal-panel {
      background: rgba(22, 9, 46, 0.88);
      border: 2px solid rgba(251, 191, 36, 0.65);
      backdrop-filter: blur(8px);
    }
    .modal-overlay {
      position: absolute; inset: 0; z-index: 30;
      background: rgba(8, 3, 18, 0.78); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
  </style>
</head>
<body>
  <div class="shell">
    <canvas id="renderCanvas"></canvas>

    <!-- INTERACTIVE 3D HUD LAYER -->
    <div class="ui-layer">
      <!-- Top Bar -->
      <div class="p-3 space-y-2 pointer-auto bg-gradient-to-b from-black/75 via-purple-950/50 to-transparent">
        <div class="flex items-center justify-between gap-1.5">
          <div class="flex items-center gap-1.5">
            <div class="hud-pill text-rose-300">❤️ <span id="hud-hearts">15</span></div>
            <div class="hud-pill text-amber-300">🪙 <span id="hud-coins">5000</span></div>
            <div class="hud-pill text-yellow-300">⭐ <span id="hud-stars">12</span></div>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="btn-sound" class="hud-pill text-white cursor-pointer">🔊</button>
          </div>
        </div>

        <!-- Gameplay Sub-HUD (visible in play/boss/nightmare) -->
        <div id="gameplay-hud" class="hidden space-y-1.5">
          <div class="flex items-center justify-between">
            <span id="hud-mode-label" class="hud-pill text-amber-300">LEVEL 1</span>
            <span class="hud-pill text-cyan-200">Moves: <span id="hud-moves" class="text-white">22</span></span>
          </div>
          <div id="boss-hp-box" class="hidden">
            <div class="flex justify-between text-xs font-bold text-rose-200 px-1">
              <span>🐻 GUMMY BEAR KING (3D BOSS)</span>
              <span id="boss-hp-pct">100%</span>
            </div>
            <div class="w-full h-3 bg-black/70 rounded-full border border-amber-400 overflow-hidden">
              <div id="boss-hp-bar" class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400 transition-all duration-300" style="width:100%"></div>
            </div>
          </div>
          <div class="flex items-center gap-2 px-1">
            <span class="text-xs font-bold text-amber-200 whitespace-nowrap">Score: <span id="hud-score">0</span> / <span id="hud-target">1500</span></span>
            <div class="flex-1 h-2.5 bg-black/60 rounded-full border border-purple-400/50 overflow-hidden">
              <div id="score-fill" class="h-full bg-gradient-to-r from-amber-400 to-yellow-300 transition-all duration-200" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Center Contextual Controls (Map / Ballroom / Shop) -->
      <div id="scene-overlay-controls" class="px-4 pointer-auto flex flex-col items-center justify-end pb-3">
        <!-- Map Quick Launch -->
        <div id="panel-map" class="royal-panel rounded-2xl p-3 w-full max-w-sm space-y-2">
          <div class="text-center text-xs text-amber-300 font-bold">INTERACTIVE 3D WORLD MAP — TAP 3D NODES OR LAUNCH</div>
          <div class="grid grid-cols-3 gap-2">
            <button id="btn-launch-normal" class="green-btn py-2 rounded-xl text-xs">▶ Lv <span id="map-lvl-txt">1</span></button>
            <button id="btn-launch-boss" class="gold-btn py-2 rounded-xl text-xs">🐻 Boss 3D</button>
            <button id="btn-launch-nightmare" class="bg-fuchsia-800 border-2 border-fuchsia-400 text-white py-2 rounded-xl text-xs font-bold">⚡ Lv 88,888</button>
          </div>
        </div>

        <!-- Ballroom Fountain Selector -->
        <div id="panel-ballroom" class="hidden royal-panel rounded-2xl p-3 w-full max-w-sm space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="text-amber-300 font-bold">3D BALLROOM FOUNTAIN</span>
            <span id="ballroom-active-txt" class="text-emerald-300 font-bold">Crystal Sugar</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button data-fountain="crystal" class="fountain-pick bg-sky-900 border-2 border-sky-300 rounded-xl py-2 text-xs font-bold">💎 Crystal (3⭐)</button>
            <button data-fountain="chocolate" class="fountain-pick bg-amber-950 border-2 border-amber-400 rounded-xl py-2 text-xs font-bold">🍫 Choco (5⭐)</button>
            <button data-fountain="honey" class="fountain-pick bg-yellow-900 border-2 border-yellow-300 rounded-xl py-2 text-xs font-bold">🍯 Honey (8⭐)</button>
          </div>
        </div>

        <!-- Gameplay Boosters Bar -->
        <div id="panel-boosters" class="hidden grid grid-cols-4 gap-2 w-full max-w-sm">
          <button id="boost-mallet" class="royal-panel rounded-xl py-2 text-center cursor-pointer">
            <div class="text-lg">🔨</div>
            <div class="text-[11px] font-bold text-amber-200">Mallet (<span id="cnt-mallet">3</span>)</div>
          </button>
          <button id="boost-wand" class="royal-panel rounded-xl py-2 text-center cursor-pointer">
            <div class="text-lg">🪄</div>
            <div class="text-[11px] font-bold text-amber-200">Wand (<span id="cnt-wand">3</span>)</div>
          </button>
          <button id="boost-rocket" class="royal-panel rounded-xl py-2 text-center cursor-pointer">
            <div class="text-lg">🚀</div>
            <div class="text-[11px] font-bold text-amber-200">Rocket (<span id="cnt-rocket">2</span>)</div>
          </button>
          <button id="boost-moves5" class="royal-panel rounded-xl py-2 text-center cursor-pointer">
            <div class="text-lg">⏱️</div>
            <div class="text-[11px] font-bold text-emerald-300">+5 (<span id="cnt-moves5">2</span>)</div>
          </button>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <div class="grid grid-cols-4 gap-1.5 px-3 py-2.5 bg-purple-950/95 border-t-2 border-amber-400/50 pointer-auto">
        <button id="nav-map" class="gold-btn py-2 rounded-xl text-xs">🗺️ 3D Map</button>
        <button id="nav-ballroom" class="bg-purple-800 border border-purple-400/50 py-2 rounded-xl text-xs font-bold text-white">🏰 Ballroom</button>
        <button id="nav-boss" class="bg-purple-800 border border-purple-400/50 py-2 rounded-xl text-xs font-bold text-white">🐻 Boss</button>
        <button id="nav-shop" class="bg-purple-800 border border-purple-400/50 py-2 rounded-xl text-xs font-bold text-white">🏦 Bank</button>
      </div>
    </div>

    <!-- ROYAL BANK MODAL -->
    <div id="modal-shop" class="modal-overlay">
      <div class="royal-panel rounded-3xl p-5 w-full max-w-xs space-y-3 text-center">
        <div class="text-xl font-extrabold text-amber-300">ROYAL BANK</div>
        <div class="grid grid-cols-1 gap-2">
          <button id="buy-starter" class="green-btn py-2.5 rounded-xl text-sm">Starter Pack (+500 🪙 &amp; +2 🔨)</button>
          <button id="buy-bundle" class="gold-btn py-2.5 rounded-xl text-sm">Booster Bundle (500 🪙)</button>
        </div>
        <button id="close-shop" class="text-xs text-purple-200 underline pt-1">Close</button>
      </div>
    </div>

    <!-- WIN / LOSE MODAL -->
    <div id="modal-result" class="modal-overlay">
      <div class="royal-panel rounded-3xl p-5 w-full max-w-xs space-y-3 text-center">
        <div id="res-title" class="text-2xl font-extrabold text-amber-300">LEVEL COMPLETE!</div>
        <div id="res-sub" class="text-sm text-purple-100">Score: 0</div>
        <div class="flex gap-2">
          <button id="res-primary" class="green-btn flex-1 py-2.5 rounded-xl text-sm">NEXT</button>
          <button id="res-secondary" class="gold-btn flex-1 py-2.5 rounded-xl text-sm">MAP</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      // --- 100,000 Levels Generator ---
      function seededRandom(seed) {
        const x = Math.sin(seed) * 10000;
        return x - Math.floor(x);
      }
      function generateInfiniteLevel(levelNumber, mode = "normal") {
        const seed = levelNumber * 1234.567;
        const targetScore = mode === "boss" ? 2200 + levelNumber * 150 : mode === "nightmare" ? 3200 : Math.floor(1200 + levelNumber * 350);
        const movesLimit = mode === "nightmare" ? 16 : Math.max(14, Math.floor(28 - Math.log10(Math.max(1, levelNumber)) * 3.5));
        const colorsCount = mode === "nightmare" ? 6 : Math.min(6, 4 + Math.floor(levelNumber / 12));
        const obstaclesRatio = mode === "nightmare" ? 0.16 : mode === "boss" ? 0.1 : Math.min(0.2, 0.04 + Math.sqrt(levelNumber) * 0.001);

        const grid = [];
        for (let r = 0; r < 8; r++) {
          const row = [];
          for (let c = 0; c < 8; c++) {
            const tileSeed = seed + (r * 8 + c);
            const isObstacle = (levelNumber >= 2 || mode !== "normal") && seededRandom(tileSeed) < obstaclesRatio;
            row.push({
              typeId: isObstacle ? -1 : Math.floor(seededRandom(tileSeed + 99) * colorsCount) + 1,
              special: "none",
              isObstacle,
              mesh: null,
            });
          }
          grid.push(row);
        }
        return { levelNumber, targetScore, movesLimit, colorsCount, grid };
      }

      // --- State ---
      const state = {
        sceneMode: "map", // map | ballroom | play
        playMode: "normal", // normal | boss | nightmare
        levelNumber: 1,
        coins: 5000,
        stars: 12,
        hearts: 15,
        fountain: "crystal",
        soundOn: true,
        boosters: { mallet: 3, wand: 3, rocket: 2, moves5: 2 },
        activeBooster: null,
        score: 0,
        targetScore: 1500,
        movesLeft: 22,
        colorsCount: 5,
        bossHp: 100,
        grid: [],
        selected: null,
        pointerDown: null,
        busy: false,
        ended: false,
      };

      // --- Web Audio SFX ---
      let audioCtx = null;
      function sfx(freq, dur = 0.12, type = "sine") {
        if (!state.soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          g.gain.setValueAtTime(0.14, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + dur);
        } catch (_) {}
      }

      // --- Babylon.js Setup ---
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.08, 0.03, 0.18, 1);

      const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.25, 16, new BABYLON.Vector3(0, 0, 0), scene);
      camera.inputs.clear();

      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, -0.5), scene);
      hemi.intensity = 1.1;
      const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(0.4, -0.9, 0.7), scene);
      dir.position = new BABYLON.Vector3(-4, 10, -8);
      dir.intensity = 0.9;

      const glow = new BABYLON.GlowLayer("glow", scene);
      glow.intensity = 0.5;

      // Scene Root Groups
      const mapGroup = new BABYLON.TransformNode("mapGroup", scene);
      const ballroomGroup = new BABYLON.TransformNode("ballroomGroup", scene);
      const playGroup = new BABYLON.TransformNode("playGroup", scene);

      let bossRoot = null;
      let bossCharacterRoot = null;
      let bossBodyMesh = null;
      let bossHeadMesh = null;
      let bossLeftArm = null;
      let bossRightArm = null;
      let fountainWaterMesh = null;
      let fountainMat = null;

      // --- 1. BUILD 3D SAGA WORLD MAP (Candy Castle, Chocolate Mountain, Level Nodes) ---
      function build3DMap() {
        // Base island
        const ground = BABYLON.MeshBuilder.CreateCylinder("mapGround", { diameter: 14, height: 0.8, tessellation: 32 }, scene);
        ground.parent = mapGroup;
        ground.position.y = -2.2;
        const gMat = new BABYLON.StandardMaterial("gMat", scene);
        gMat.diffuseColor = new BABYLON.Color3(0.18, 0.65, 0.32);
        ground.material = gMat;

        // Chocolate Mountain
        const chocoMtn = BABYLON.MeshBuilder.CreateCylinder("chocoMtn", { diameterTop: 1.5, diameterBottom: 5.5, height: 3.4, tessellation: 20 }, scene);
        chocoMtn.parent = mapGroup;
        chocoMtn.position = new BABYLON.Vector3(-2.6, -0.2, 2.2);
        const chMat = new BABYLON.StandardMaterial("chMat", scene);
        chMat.diffuseColor = new BABYLON.Color3(0.38, 0.18, 0.08);
        chocoMtn.material = chMat;

        // 3D Candy Castle
        const castleBase = BABYLON.MeshBuilder.CreateBox("castleBase", { width: 3.2, height: 2.2, depth: 2.4 }, scene);
        castleBase.parent = mapGroup;
        castleBase.position = new BABYLON.Vector3(2.1, 0.2, 2.8);
        const cMat = new BABYLON.StandardMaterial("cMat", scene);
        cMat.diffuseColor = new BABYLON.Color3(0.85, 0.45, 0.88);
        castleBase.material = cMat;

        [-1.3, 1.3].forEach((tx, idx) => {
          const tower = BABYLON.MeshBuilder.CreateCylinder(`tower_${idx}`, { diameter: 0.9, height: 3.4, tessellation: 16 }, scene);
          tower.parent = mapGroup;
          tower.position = new BABYLON.Vector3(2.1 + tx, 0.8, 2.8);
          tower.material = cMat;

          const roof = BABYLON.MeshBuilder.CreateCylinder(`roof_${idx}`, { diameterTop: 0, diameterBottom: 1.25, height: 1.3, tessellation: 16 }, scene);
          roof.parent = mapGroup;
          roof.position = new BABYLON.Vector3(2.1 + tx, 3.1, 2.8);
          const rMat = new BABYLON.StandardMaterial(`rMat_${idx}`, scene);
          rMat.diffuseColor = new BABYLON.Color3(0.95, 0.22, 0.45);
          rMat.emissiveColor = new BABYLON.Color3(0.2, 0.04, 0.1);
          roof.material = rMat;
        });

        // Interactive 3D Level Pedestals
        const nodes = [
          { x: -2.4, z: -3.2, lvl: 1, mode: "normal", col: new BABYLON.Color3(0.2, 0.85, 0.4) },
          { x: 0.0, z: -2.2, lvl: 2, mode: "normal", col: new BABYLON.Color3(0.2, 0.65, 1.0) },
          { x: 2.2, z: -1.0, lvl: 9, mode: "boss", col: new BABYLON.Color3(0.95, 0.2, 0.25) },
          { x: -0.4, z: 0.5, lvl: 88888, mode: "nightmare", col: new BABYLON.Color3(0.75, 0.2, 0.95) },
        ];
        nodes.forEach((n, idx) => {
          const ped = BABYLON.MeshBuilder.CreateCylinder(`mapNode_${idx}`, { diameter: 1.25, height: 0.45, tessellation: 20 }, scene);
          ped.parent = mapGroup;
          ped.position = new BABYLON.Vector3(n.x, -1.6, n.z);
          const nMat = new BABYLON.StandardMaterial(`nMat_${idx}`, scene);
          nMat.diffuseColor = n.col;
          nMat.emissiveColor = n.col.scale(0.35);
          ped.material = nMat;
          ped.metadata = { mapNode: true, lvl: n.lvl, mode: n.mode };
        });
      }

      // --- 2. BUILD 3D ROYAL BALLROOM + DYNAMIC FOUNTAIN ---
      function build3DBallroom() {
        const floor = BABYLON.MeshBuilder.CreateCylinder("ballFloor", { diameter: 13, height: 0.5, tessellation: 32 }, scene);
        floor.parent = ballroomGroup;
        floor.position.y = -2.2;
        const fFloorMat = new BABYLON.StandardMaterial("fFloorMat", scene);
        fFloorMat.diffuseColor = new BABYLON.Color3(0.92, 0.72, 0.82);
        floor.material = fFloorMat;

        // Pillars
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6;
          const p = BABYLON.MeshBuilder.CreateCylinder(`pillar_${i}`, { diameter: 0.7, height: 5.5, tessellation: 16 }, scene);
          p.parent = ballroomGroup;
          p.position = new BABYLON.Vector3(Math.cos(a) * 4.8, 0.5, Math.sin(a) * 4.8);
          const pMat = new BABYLON.StandardMaterial(`pMat_${i}`, scene);
          pMat.diffuseColor = new BABYLON.Color3(0.95, 0.85, 0.55);
          p.material = pMat;
        }

        // Grand Fountain (3 tiers)
        fountainMat = new BABYLON.StandardMaterial("fountainMat", scene);
        [2.8, 1.8, 0.9].forEach((d, idx) => {
          const tier = BABYLON.MeshBuilder.CreateCylinder(`fTier_${idx}`, { diameter: d, height: 0.7, tessellation: 24 }, scene);
          tier.parent = ballroomGroup;
          tier.position.y = -1.6 + idx * 0.9;
          tier.material = fountainMat;
        });
        fountainWaterMesh = BABYLON.MeshBuilder.CreateSphere("fCrown", { diameter: 1.0, segments: 16 }, scene);
        fountainWaterMesh.parent = ballroomGroup;
        fountainWaterMesh.position.y = 1.2;
        fountainWaterMesh.material = fountainMat;

        applyFountainTheme("crystal");
      }

      function applyFountainTheme(theme) {
        state.fountain = theme;
        if (!fountainMat) return;
        if (theme === "crystal") {
          fountainMat.diffuseColor = new BABYLON.Color3(0.3, 0.85, 1.0);
          fountainMat.emissiveColor = new BABYLON.Color3(0.1, 0.35, 0.55);
        } else if (theme === "chocolate") {
          fountainMat.diffuseColor = new BABYLON.Color3(0.42, 0.2, 0.08);
          fountainMat.emissiveColor = new BABYLON.Color3(0.12, 0.05, 0.02);
        } else {
          fountainMat.diffuseColor = new BABYLON.Color3(1.0, 0.78, 0.15);
          fountainMat.emissiveColor = new BABYLON.Color3(0.45, 0.28, 0.03);
        }
        const label = theme === "crystal" ? "Crystal Sugar" : theme === "chocolate" ? "Rich Chocolate" : "Golden Honey";
        document.getElementById("ballroom-active-txt").textContent = label;
      }

      // --- 3. BUILD 3D GUMMY BEAR KING BOSS ON CHOCOLATE THRONE ---
      function build3DBoss() {
        bossRoot = new BABYLON.TransformNode("bossRoot", scene);
        bossRoot.parent = playGroup;
        bossRoot.position = new BABYLON.Vector3(0, 5.2, 0.4);
        bossCharacterRoot = new BABYLON.TransformNode('bossCharacterRoot', scene);
        bossCharacterRoot.parent = bossRoot;

        const chocoMat = new BABYLON.StandardMaterial("bossThroneMat", scene);
        chocoMat.diffuseColor = new BABYLON.Color3(0.35, 0.15, 0.07);
        const throneBack = BABYLON.MeshBuilder.CreateBox("throneBack", { width: 2.8, height: 2.6, depth: 0.6 }, scene);
        throneBack.parent = bossRoot;
        throneBack.position.z = 0.5;
        throneBack.material = chocoMat;

        const gummyMat = new BABYLON.StandardMaterial("gummyMat", scene);
        gummyMat.diffuseColor = new BABYLON.Color3(0.95, 0.15, 0.32);
        gummyMat.emissiveColor = new BABYLON.Color3(0.35, 0.03, 0.08);
        gummyMat.alpha = 0.92;

        bossBodyMesh = BABYLON.MeshBuilder.CreateSphere('bossBody', { diameter: 1.5, segments: 24 }, scene);
        bossBodyMesh.parent = bossCharacterRoot;
        bossBodyMesh.position.y = -0.2;
        bossBodyMesh.material = gummyMat;

        bossHeadMesh = BABYLON.MeshBuilder.CreateSphere('bossHead', { diameter: 1.15, segments: 24 }, scene);
        bossHeadMesh.parent = bossCharacterRoot;
        bossHeadMesh.position.y = 0.85;
        bossHeadMesh.material = gummyMat;

        // Friendly readable face, facing the board camera.
        const eyeWhite = new BABYLON.StandardMaterial("bossEyeWhite", scene);
        eyeWhite.diffuseColor = new BABYLON.Color3(1, 0.96, 0.9);
        const pupilMat = new BABYLON.StandardMaterial("bossPupil", scene);
        pupilMat.diffuseColor = new BABYLON.Color3(0.12, 0.04, 0.1);
        const noseMat = new BABYLON.StandardMaterial("bossNose", scene);
        noseMat.diffuseColor = new BABYLON.Color3(0.42, 0.04, 0.12);
        [-0.23, 0.23].forEach((z, i) => {
          const eye = BABYLON.MeshBuilder.CreateSphere("bossEye_" + i, { diameter: 0.2, segments: 16 }, scene);
          eye.parent = bossCharacterRoot;
          eye.position = new BABYLON.Vector3(-0.49, 0.98, z);
          eye.material = eyeWhite;
          const pupil = BABYLON.MeshBuilder.CreateSphere("bossPupil_" + i, { diameter: 0.105, segments: 12 }, scene);
          pupil.parent = bossCharacterRoot;
          pupil.position = new BABYLON.Vector3(-0.585, 0.98, z);
          pupil.material = pupilMat;
        });
        const nose = BABYLON.MeshBuilder.CreateSphere("bossNose", { diameter: 0.17, segments: 16 }, scene);
        nose.parent = bossCharacterRoot;
        nose.position = new BABYLON.Vector3(-0.57, 0.72, 0);
        nose.material = noseMat;

        const armMat = gummyMat;
        bossLeftArm = new BABYLON.TransformNode("bossLeftArm", scene);
        bossLeftArm.parent = bossCharacterRoot;
        bossLeftArm.position = new BABYLON.Vector3(0, 0.18, -0.68);
        const leftArmMesh = BABYLON.MeshBuilder.CreateCapsule("bossLeftArmMesh", { radius: 0.22, height: 0.9, tessellation: 16 }, scene);
        leftArmMesh.parent = bossLeftArm;
        leftArmMesh.position.z = -0.18;
        leftArmMesh.rotation.x = Math.PI / 2;
        leftArmMesh.material = armMat;

        bossRightArm = new BABYLON.TransformNode("bossRightArm", scene);
        bossRightArm.parent = bossCharacterRoot;
        bossRightArm.position = new BABYLON.Vector3(0, 0.18, 0.68);
        const rightArmMesh = BABYLON.MeshBuilder.CreateCapsule("bossRightArmMesh", { radius: 0.22, height: 0.9, tessellation: 16 }, scene);
        rightArmMesh.parent = bossRightArm;
        rightArmMesh.position.z = 0.18;
        rightArmMesh.rotation.x = Math.PI / 2;
        rightArmMesh.material = armMat;

        [-0.45, 0.45].forEach((ex, i) => {
          const ear = BABYLON.MeshBuilder.CreateSphere(`bossEar_${i}`, { diameter: 0.42 }, scene);
          ear.parent = bossCharacterRoot;
          ear.position = new BABYLON.Vector3(ex, 1.35, 0);
          ear.material = gummyMat;
        });

        const crown = BABYLON.MeshBuilder.CreateCylinder("bossCrown", { diameterTop: 0.85, diameterBottom: 0.55, height: 0.45, tessellation: 8 }, scene);
        crown.parent = bossCharacterRoot;
        crown.position.y = 1.55;
        const crownMat = new BABYLON.StandardMaterial("crownMat", scene);
        crownMat.diffuseColor = new BABYLON.Color3(1, 0.82, 0.15);
        crownMat.emissiveColor = new BABYLON.Color3(0.4, 0.3, 0.02);
        crown.material = crownMat;
      }

      // --- 4. BUILD 3D MATCH-3 BOARD & CANDY MODELS ---
      const CELL = 1.02;
      const OFFSET = -((7 * CELL) / 2);
      const CANDY_COLORS = [
        new BABYLON.Color3(0.96, 0.18, 0.34), // Heart
        new BABYLON.Color3(0.16, 0.72, 1.0),  // Diamond
        new BABYLON.Color3(0.2, 0.84, 0.38),  // Leaf
        new BABYLON.Color3(1.0, 0.84, 0.14),  // Star
        new BABYLON.Color3(0.72, 0.28, 0.98), // Jelly
        new BABYLON.Color3(1.0, 0.52, 0.1),   // Orange
      ];

      function gridPos(r, c) {
        return new BABYLON.Vector3(OFFSET + c * CELL, -(OFFSET + r * CELL) - 0.6, 0);
      }

      function buildBoardFrame() {
        const frame = BABYLON.MeshBuilder.CreateBox("boardBg", { width: 8.5, height: 8.5, depth: 0.3 }, scene);
        frame.parent = playGroup;
        frame.position = new BABYLON.Vector3(0, -0.6, 0.55);
        const fMat = new BABYLON.StandardMaterial("boardFrameMat", scene);
        fMat.diffuseColor = new BABYLON.Color3(0.16, 0.06, 0.32);
        fMat.alpha = 0.85;
        frame.material = fMat;
      }

      function createCandy3D(r, c, typeId, special, isObstacle) {
        let mesh;
        if (isObstacle) {
          mesh = BABYLON.MeshBuilder.CreateBox(`obs_${r}_${c}_${Date.now()}`, { size: 0.78 }, scene);
          const m = new BABYLON.StandardMaterial("obs3dMat", scene);
          m.diffuseColor = state.playMode === "nightmare" ? new BABYLON.Color3(0.25, 0.08, 0.05) : new BABYLON.Color3(0.38, 0.18, 0.1);
          m.emissiveColor = state.playMode === "nightmare" ? new BABYLON.Color3(0.4, 0.12, 0.02) : new BABYLON.Color3(0, 0, 0);
          mesh.material = m;
        } else if (special === "color_bomb") {
          mesh = BABYLON.MeshBuilder.CreateSphere(`bomb_${r}_${c}_${Date.now()}`, { diameter: 0.82 }, scene);
          const m = new BABYLON.StandardMaterial("bomb3dMat", scene);
          m.emissiveColor = new BABYLON.Color3(0.85, 0.35, 0.95);
          mesh.material = m;
        } else {
          const col = CANDY_COLORS[(typeId - 1) % CANDY_COLORS.length];
          if (typeId === 1) mesh = BABYLON.MeshBuilder.CreatePolyhedron(`c_${r}_${c}`, { type: 1, size: 0.38 }, scene);
          else if (typeId === 2) mesh = BABYLON.MeshBuilder.CreatePolyhedron(`c_${r}_${c}`, { type: 0, size: 0.38 }, scene);
          else if (typeId === 3) mesh = BABYLON.MeshBuilder.CreateCapsule(`c_${r}_${c}`, { radius: 0.27, height: 0.72 }, scene);
          else if (typeId === 4) mesh = BABYLON.MeshBuilder.CreatePolyhedron(`c_${r}_${c}`, { type: 2, size: 0.38 }, scene);
          else if (typeId === 5) mesh = BABYLON.MeshBuilder.CreateBox(`c_${r}_${c}`, { size: 0.68 }, scene);
          else mesh = BABYLON.MeshBuilder.CreateSphere(`c_${r}_${c}`, { diameter: 0.76 }, scene);

          const m = new BABYLON.StandardMaterial(`cm_${typeId}_${Date.now()}`, scene);
          m.diffuseColor = col;
          m.emissiveColor = col.scale(0.18);
          m.ambientColor = col.scale(0.32);
          m.specularColor = new BABYLON.Color3(1, 1, 1);
          m.specularPower = 128;
          m.useSpecularOverAlpha = true;
          m.emissiveFresnelParameters = new BABYLON.FresnelParameters();
          m.emissiveFresnelParameters.bias = 0.08;
          m.emissiveFresnelParameters.power = 2.4;
          m.emissiveFresnelParameters.leftColor = col.scale(0.12);
          m.emissiveFresnelParameters.rightColor = new BABYLON.Color3(0.42, 0.3, 0.58);
          mesh.material = m;

          if (special === "striped_h" || special === "striped_v") {
            const ring = BABYLON.MeshBuilder.CreateTorus("ring", { diameter: 0.84, thickness: 0.08 }, scene);
            ring.parent = mesh;
            if (special === "striped_v") ring.rotation.y = Math.PI / 2;
          } else if (special === "wrapped") {
            const box = BABYLON.MeshBuilder.CreateBox("wrap", { size: 0.84 }, scene);
            box.parent = mesh;
            const wm = new BABYLON.StandardMaterial("wm", scene);
            wm.alpha = 0.3; wm.emissiveColor = new BABYLON.Color3(1, 0.85, 0.2);
            box.material = wm;
          }
        }
        // Fixed glossy highlight: adds a polished sugar-shell look without spinning the candy.
        if (!isObstacle) {
          const shine = BABYLON.MeshBuilder.CreateSphere(`candyShine_${r}_${c}`, { diameter: 0.24, segments: 12 }, scene);
          shine.parent = mesh;
          shine.position = new BABYLON.Vector3(-0.34, 0.2, -0.12);
          shine.scaling = new BABYLON.Vector3(0.22, 0.58, 0.72);
          const shineMat = new BABYLON.StandardMaterial(`candyShineMat_${r}_${c}`, scene);
          shineMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
          shineMat.emissiveColor = new BABYLON.Color3(0.72, 0.78, 1);
          shineMat.specularColor = new BABYLON.Color3(1, 1, 1);
          shineMat.alpha = 0.78;
          shine.material = shineMat;
          shine.isPickable = false;
        }
        mesh.parent = playGroup;
        mesh.position = gridPos(r, c);
        mesh.metadata = { r, c, isCandy: true };
        return mesh;
      }

      // --- Scene Switching ---
      function switchScene(mode) {
        state.sceneMode = mode;
        mapGroup.setEnabled(mode === "map");
        ballroomGroup.setEnabled(mode === "ballroom");
        playGroup.setEnabled(mode === "play");

        document.getElementById("panel-map").classList.toggle("hidden", mode !== "map");
        document.getElementById("panel-ballroom").classList.toggle("hidden", mode !== "ballroom");
        document.getElementById("panel-boosters").classList.toggle("hidden", mode !== "play");
        document.getElementById("gameplay-hud").classList.toggle("hidden", mode !== "play");

        if (mode === "map") {
          camera.setPosition(new BABYLON.Vector3(0, 7.5, -11.5));
          camera.setTarget(new BABYLON.Vector3(0, -1.0, 0));
          scene.clearColor = new BABYLON.Color4(0.08, 0.14, 0.28, 1);
        } else if (mode === "ballroom") {
          camera.setPosition(new BABYLON.Vector3(0, 4.5, -10.5));
          camera.setTarget(new BABYLON.Vector3(0, -0.5, 0));
          scene.clearColor = new BABYLON.Color4(0.18, 0.07, 0.24, 1);
        } else {
          camera.setPosition(new BABYLON.Vector3(0, state.playMode === "boss" ? 1.5 : 0, state.playMode === "boss" ? -15.5 : -13.5));
          camera.setTarget(new BABYLON.Vector3(0, state.playMode === "boss" ? 0.8 : -0.6, 0));
          scene.clearColor = state.playMode === "nightmare"
            ? new BABYLON.Color4(0.06, 0.02, 0.12, 1)
            : new BABYLON.Color4(0.12, 0.04, 0.24, 1);
        }
        syncHUD();
      }

      function startPlay(levelNum, playMode = "normal") {
        state.playMode = playMode;
        clearPlayMeshes();
        const cfg = generateInfiniteLevel(levelNum, playMode);
        state.levelNumber = cfg.levelNumber;
        state.targetScore = cfg.targetScore;
        state.movesLeft = cfg.movesLimit;
        state.colorsCount = cfg.colorsCount;
        state.grid = cfg.grid;
        state.score = 0;
        state.bossHp = 100;
        state.busy = false;
        state.ended = false;
        state.activeBooster = null;
        state.selected = null;

        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (state.grid[r][c].isObstacle) continue;
            while (
              (c >= 2 && state.grid[r][c].typeId === state.grid[r][c - 1].typeId && state.grid[r][c].typeId === state.grid[r][c - 2].typeId) ||
              (r >= 2 && state.grid[r][c].typeId === state.grid[r - 1][c].typeId && state.grid[r][c].typeId === state.grid[r - 2][c].typeId)
            ) {
              state.grid[r][c].typeId = Math.floor(Math.random() * state.colorsCount) + 1;
            }
          }
        }

        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const cell = state.grid[r][c];
            cell.mesh = createCandy3D(r, c, cell.typeId, cell.special, cell.isObstacle);
          }
        }

        if (bossRoot) bossRoot.setEnabled(playMode === "boss");
        document.getElementById("boss-hp-box").classList.toggle("hidden", playMode !== "boss");
        document.getElementById("hud-mode-label").textContent =
          playMode === "boss" ? "BOSS BATTLE" : playMode === "nightmare" ? "NIGHTMARE 88,888" : `LEVEL ${levelNum}`;

        document.getElementById("modal-result").classList.remove("open");
        switchScene("play");
      }

      function clearPlayMeshes() {
        for (let r = 0; r < state.grid.length; r++) {
          for (let c = 0; c < state.grid[r].length; c++) {
            if (state.grid[r][c]?.mesh) state.grid[r][c].mesh.dispose();
          }
        }
      }

      // --- Match-3 Logic ---
      function findMatches() {
        const horiz = [], vert = [];
        for (let r = 0; r < 8; r++) {
          let run = [{ r, c: 0 }];
          for (let c = 1; c < 8; c++) {
            const a = state.grid[r][c], b = state.grid[r][c - 1];
            if (!a.isObstacle && !b.isObstacle && a.typeId > 0 && a.typeId === b.typeId) run.push({ r, c });
            else { if (run.length >= 3) horiz.push(run); run = [{ r, c }]; }
          }
          if (run.length >= 3) horiz.push(run);
        }
        for (let c = 0; c < 8; c++) {
          let run = [{ r: 0, c }];
          for (let r = 1; r < 8; r++) {
            const a = state.grid[r][c], b = state.grid[r - 1][c];
            if (!a.isObstacle && !b.isObstacle && a.typeId > 0 && a.typeId === b.typeId) run.push({ r, c });
            else { if (run.length >= 3) vert.push(run); run = [{ r, c }]; }
          }
          if (run.length >= 3) vert.push(run);
        }
        return { horiz, vert, groups: [...horiz, ...vert] };
      }

      async function trySwap(r1, c1, r2, c2) {
        const a = state.grid[r1][c1], b = state.grid[r2][c2];
        if (a.isObstacle || b.isObstacle) return;
        state.busy = true;
        swapCells(r1, c1, r2, c2);
        sfx(440, 0.08, "triangle");
        await wait(140);

        if (a.special === "color_bomb" || b.special === "color_bomb") {
          state.movesLeft--;
          const target = a.special === "color_bomb" ? b.typeId : a.typeId;
          const set = new Set([`${r1},${c1}`, `${r2},${c2}`]);
          for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (state.grid[r][c].typeId === target) set.add(`${r},${c}`);
          await clearSetAndRefill(set, []);
          state.busy = false;
          return;
        }

        const m = findMatches();
        if (m.groups.length === 0) {
          swapCells(r1, c1, r2, c2);
          sfx(200, 0.1, "sawtooth");
          state.busy = false;
          return;
        }
        state.movesLeft--;
        await processMatches(m, { r: r2, c: c2 });
        await cascade();
        checkEnd();
        state.busy = false;
      }

      function swapCells(r1, c1, r2, c2) {
        const a = state.grid[r1][c1], b = state.grid[r2][c2];
        state.grid[r1][c1] = b; state.grid[r2][c2] = a;
        if (a.mesh) { a.mesh.metadata.r = r2; a.mesh.metadata.c = c2; a.mesh.position.copyFrom(gridPos(r2, c2)); }
        if (b.mesh) { b.mesh.metadata.r = r1; b.mesh.metadata.c = c1; b.mesh.position.copyFrom(gridPos(r1, c1)); }
      }

      async function processMatches(matches, pivot) {
        const set = new Set(), spawns = [];
        const hSet = new Set();
        matches.horiz.forEach((g) => g.forEach((p) => hSet.add(`${p.r},${p.c}`)));
        matches.vert.forEach((g) => g.forEach((p) => { if (hSet.has(`${p.r},${p.c}`)) spawns.push({ r: p.r, c: p.c, typeId: state.grid[p.r][p.c].typeId, special: "wrapped" }); }));

        for (const g of matches.groups) {
          g.forEach((p) => set.add(`${p.r},${p.c}`));
          if (g.length >= 5) {
            const s = (pivot && g.find((p) => p.r === pivot.r && p.c === pivot.c)) || g[2];
            spawns.push({ r: s.r, c: s.c, typeId: 0, special: "color_bomb" });
          } else if (g.length === 4) {
            const s = (pivot && g.find((p) => p.r === pivot.r && p.c === pivot.c)) || g[1];
            spawns.push({ r: s.r, c: s.c, typeId: state.grid[s.r][s.c].typeId, special: g[0].r === g[1].r ? "striped_v" : "striped_h" });
          }
        }
        await clearSetAndRefill(set, spawns);
      }

      async function clearSetAndRefill(set, spawns) {
        const q = Array.from(set), seen = new Set();
        while (q.length) {
          const k = q.shift();
          if (seen.has(k)) continue;
          const [r, c] = k.split(",").map(Number);
          const cell = state.grid[r][c];
          if (!cell || cell.special === "none") continue;
          seen.add(k);
          if (cell.special === "striped_h") for (let i = 0; i < 8; i++) { const nk = `${r},${i}`; if (!set.has(nk)) { set.add(nk); q.push(nk); } }
          else if (cell.special === "striped_v") for (let i = 0; i < 8; i++) { const nk = `${i},${c}`; if (!set.has(nk)) { set.add(nk); q.push(nk); } }
          else if (cell.special === "wrapped") for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) { const nk = `${nr},${nc}`; if (!set.has(nk)) { set.add(nk); q.push(nk); } }
          }
        }

        const obs = [];
        set.forEach((k) => {
          const [r, c] = k.split(",").map(Number);
          [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].forEach(([nr, nc]) => {
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && state.grid[nr][nc].isObstacle) obs.push(`${nr},${nc}`);
          });
        });
        obs.forEach((k) => set.add(k));

        set.forEach((k) => {
          const [r, c] = k.split(",").map(Number);
          if (state.grid[r][c].mesh) state.grid[r][c].mesh.dispose();
          state.grid[r][c] = { typeId: 0, special: "none", isObstacle: false, mesh: null };
          state.score += 75;
        });

        spawns.forEach((sp) => {
          state.grid[sp.r][sp.c] = {
            typeId: sp.typeId, special: sp.special, isObstacle: false,
            mesh: createCandy3D(sp.r, sp.c, sp.typeId, sp.special, false),
          };
        });

        if (state.playMode === "boss") {
          state.bossHp = Math.max(0, state.bossHp - Math.max(4, Math.round(set.size * 2.2)));
          if (bossCharacterRoot) bossCharacterRoot.scaling.setAll(1.12);
          setTimeout(() => { if (bossCharacterRoot) bossCharacterRoot.scaling.setAll(1); }, 140);
        }
        sfx(set.size >= 5 ? 740 : 540, 0.14);
        syncHUD();
        await wait(140);
      }

      async function cascade() {
        while (true) {
          for (let c = 0; c < 8; c++) {
            for (let r = 7; r >= 0; r--) {
              if (state.grid[r][c].typeId === 0 && !state.grid[r][c].isObstacle && state.grid[r][c].special !== "color_bomb") {
                for (let above = r - 1; above >= 0; above--) {
                  if (state.grid[above][c].isObstacle) break;
                  if (state.grid[above][c].typeId > 0 || state.grid[above][c].special === "color_bomb") {
                    state.grid[r][c] = state.grid[above][c];
                    state.grid[above][c] = { typeId: 0, special: "none", isObstacle: false, mesh: null };
                    if (state.grid[r][c].mesh) {
                      state.grid[r][c].mesh.metadata.r = r;
                      state.grid[r][c].mesh.metadata.c = c;
                      state.grid[r][c].mesh.position.copyFrom(gridPos(r, c));
                    }
                    break;
                  }
                }
              }
            }
            for (let r = 0; r < 8; r++) {
              if (state.grid[r][c].isObstacle) break;
              if (state.grid[r][c].typeId === 0 && state.grid[r][c].special !== "color_bomb") {
                const t = Math.floor(Math.random() * state.colorsCount) + 1;
                state.grid[r][c] = { typeId: t, special: "none", isObstacle: false, mesh: createCandy3D(r, c, t, "none", false) };
              }
            }
          }
          await wait(140);
          const next = findMatches();
          if (next.groups.length === 0) break;
          await processMatches(next, null);
        }
      }

      function checkEnd() {
        const won = state.playMode === "boss" ? (state.bossHp <= 0 || state.score >= state.targetScore) : state.score >= state.targetScore;
        const modal = document.getElementById("modal-result");
        if (won) {
          state.ended = true;
          state.stars += 3;
          state.coins += 150;
          if (state.playMode === "normal") state.levelNumber += 1;
          document.getElementById("res-title").textContent = "LEVEL COMPLETE!";
          document.getElementById("res-sub").textContent = `Score: ${state.score} (+3 ⭐, +150 🪙)`;
          document.getElementById("res-primary").textContent = "NEXT LEVEL";
          modal.classList.add("open");
          syncHUD();
        } else if (state.movesLeft <= 0) {
          state.ended = true;
          document.getElementById("res-title").textContent = "OUT OF MOVES!";
          document.getElementById("res-sub").textContent = "Use 100 🪙 for +5 Extra Moves?";
          document.getElementById("res-primary").textContent = "+5 MOVES (100 🪙)";
          modal.classList.add("open");
        }
      }

      // --- Pointer Picking for 3D Map & 3D Board ---
      scene.onPointerObservable.add(async (pi) => {
        if (pi.type === BABYLON.PointerEventTypes.POINTERDOWN) {
          const pick = scene.pick(scene.pointerX, scene.pointerY);
          if (!pick?.hit || !pick.pickedMesh?.metadata) return;
          const md = pick.pickedMesh.metadata;
          if (state.sceneMode === "map" && md.mapNode) {
            startPlay(md.lvl, md.mode);
            return;
          }
          if (state.sceneMode === "play" && md.isCandy && !state.busy && !state.ended) {
            if (state.activeBooster) {
              const b = state.activeBooster;
              state.activeBooster = null;
              state.boosters[b]--;
              state.busy = true;
              const set = new Set();
              if (b === "mallet") set.add(`${md.r},${md.c}`);
              else if (b === "wand") {
                const t = state.grid[md.r][md.c].typeId;
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (state.grid[r][c].typeId === t && !state.grid[r][c].isObstacle) set.add(`${r},${c}`);
              } else if (b === "rocket") {
                for (let i = 0; i < 8; i++) { set.add(`${md.r},${i}`); set.add(`${i},${md.c}`); }
              }
              await clearSetAndRefill(set, []);
              await cascade();
              checkEnd();
              state.busy = false;
              return;
            }
            state.pointerDown = { r: md.r, c: md.c, x: scene.pointerX, y: scene.pointerY };
          }
        } else if (pi.type === BABYLON.PointerEventTypes.POINTERUP && state.pointerDown && !state.busy && !state.ended) {
          const start = state.pointerDown;
          state.pointerDown = null;
          const dx = scene.pointerX - start.x, dy = scene.pointerY - start.y;
          if (Math.hypot(dx, dy) > 18) {
            let dr = 0, dc = 0;
            if (Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
            else dr = dy > 0 ? 1 : -1;
            const nr = start.r + dr, nc = start.c + dc;
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
              state.selected = null;
              trySwap(start.r, start.c, nr, nc);
            }
          } else {
            if (!state.selected) {
              state.selected = { r: start.r, c: start.c };
              if (state.grid[start.r][start.c].mesh) state.grid[start.r][start.c].mesh.scaling.setAll(1.18);
            } else {
              const prev = state.selected;
              state.selected = null;
              if (state.grid[prev.r][prev.c].mesh) state.grid[prev.r][prev.c].mesh.scaling.setAll(1);
              if (Math.abs(prev.r - start.r) + Math.abs(prev.c - start.c) === 1) trySwap(prev.r, prev.c, start.r, start.c);
            }
          }
        }
      });

      function syncHUD() {
        document.getElementById("hud-hearts").textContent = state.hearts;
        document.getElementById("hud-coins").textContent = state.coins;
        document.getElementById("hud-stars").textContent = state.stars;
        document.getElementById("map-lvl-txt").textContent = state.levelNumber;
        document.getElementById("hud-moves").textContent = state.movesLeft;
        document.getElementById("hud-score").textContent = state.score;
        document.getElementById("hud-target").textContent = state.targetScore;
        document.getElementById("score-fill").style.width = Math.min(100, Math.round((state.score / state.targetScore) * 100)) + "%";
        document.getElementById("boss-hp-pct").textContent = state.bossHp + "%";
        document.getElementById("boss-hp-bar").style.width = state.bossHp + "%";
        ["mallet", "wand", "rocket", "moves5"].forEach((k) => {
          document.getElementById(`cnt-${k}`).textContent = state.boosters[k];
          document.getElementById(`boost-${k}`).style.borderColor = state.activeBooster === k ? "#4ade80" : "rgba(251, 191, 36, 0.65)";
        });
      }

      function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

      // --- UI Handlers ---
      document.getElementById("nav-map").addEventListener("click", () => switchScene("map"));
      document.getElementById("nav-ballroom").addEventListener("click", () => switchScene("ballroom"));
      document.getElementById("nav-boss").addEventListener("click", () => startPlay(9, "boss"));
      document.getElementById("nav-shop").addEventListener("click", () => document.getElementById("modal-shop").classList.add("open"));
      document.getElementById("close-shop").addEventListener("click", () => document.getElementById("modal-shop").classList.remove("open"));
      document.getElementById("btn-sound").addEventListener("click", () => {
        state.soundOn = !state.soundOn;
        document.getElementById("btn-sound").textContent = state.soundOn ? "🔊" : "🔇";
      });

      document.getElementById("btn-launch-normal").addEventListener("click", () => startPlay(state.levelNumber, "normal"));
      document.getElementById("btn-launch-boss").addEventListener("click", () => startPlay(9, "boss"));
      document.getElementById("btn-launch-nightmare").addEventListener("click", () => startPlay(88888, "nightmare"));

      document.querySelectorAll(".fountain-pick").forEach((btn) => {
        btn.addEventListener("click", () => {
          const f = btn.dataset.fountain;
          const cost = f === "honey" ? 8 : f === "chocolate" ? 5 : 3;
          if (state.stars >= cost) {
            state.stars -= cost;
            applyFountainTheme(f);
            syncHUD();
            sfx(680, 0.16);
          }
        });
      });

      document.getElementById("buy-starter").addEventListener("click", () => { state.coins += 500; state.boosters.mallet += 2; syncHUD(); sfx(720); });
      document.getElementById("buy-bundle").addEventListener("click", () => {
        if (state.coins >= 500) { state.coins -= 500; state.boosters.mallet += 2; state.boosters.wand += 2; state.boosters.rocket += 2; syncHUD(); sfx(720); }
      });

      ["mallet", "wand", "rocket", "moves5"].forEach((k) => {
        document.getElementById(`boost-${k}`).addEventListener("click", () => {
          if (state.busy || state.ended || state.boosters[k] <= 0) return;
          if (k === "moves5") { state.boosters.moves5--; state.movesLeft += 5; syncHUD(); return; }
          state.activeBooster = state.activeBooster === k ? null : k;
          syncHUD();
        });
      });

      document.getElementById("res-primary").addEventListener("click", () => {
        if (state.movesLeft <= 0 && state.coins >= 100) {
          state.coins -= 100; state.movesLeft += 5; state.ended = false;
          document.getElementById("modal-result").classList.remove("open");
          syncHUD();
        } else {
          startPlay(state.levelNumber, "normal");
        }
      });
      document.getElementById("res-secondary").addEventListener("click", () => {
        document.getElementById("modal-result").classList.remove("open");
        switchScene("map");
      });

      // --- Boot & Render Loop ---
      build3DMap();
      build3DBallroom();
      build3DBoss();
      buildBoardFrame();
      switchScene("map");

      let t = 0;
      engine.runRenderLoop(() => {
        t += 0.02;
        // Only the character idles; throne, candies and scenery remain still.
        if (bossCharacterRoot && bossRoot && bossRoot.isEnabled()) {
          bossCharacterRoot.position.y = Math.sin(t * 2.1) * 0.045;
          bossCharacterRoot.rotation.y = Math.sin(t * 0.8) * 0.035;
          if (bossBodyMesh) bossBodyMesh.scaling.y = 1 + Math.sin(t * 2.1) * 0.025;
          if (bossHeadMesh) bossHeadMesh.rotation.z = Math.sin(t * 1.35) * 0.035;
          if (bossLeftArm) bossLeftArm.rotation.x = Math.sin(t * 1.7) * 0.12;
          if (bossRightArm) bossRightArm.rotation.x = -Math.sin(t * 1.7) * 0.12;
        }
        scene.render();
      });
      window.addEventListener("resize", () => engine.resize());
    })();
  </script>
</body>
</html>
