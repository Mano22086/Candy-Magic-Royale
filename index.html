<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#27104e">
  <meta name="description" content="Candy Magic Royale — عالم الحلوى السحري">
  <title>Candy Magic Royale</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <button class="icon-button" id="soundBtn" aria-label="الصوت">♫</button>
      <div class="brand">
        <span class="brand-crown">♛</span>
        <div><strong>CANDY MAGIC</strong><small>ROYale kingdom</small></div>
      </div>
      <div class="coin-pill"><span>✦</span><b id="coinCount">500</b><button id="plusCoins" aria-label="المزيد">＋</button></div>
    </header>

    <section class="level-strip">
      <div class="level-label"><span>المملكة المسحورة</span><b id="levelLabel">المستوى 1</b></div>
      <div class="level-progress"><i id="levelProgress"></i></div>
      <div class="level-stats"><span>⭐ <b id="stars">0</b></span><span>الحركات <b id="moves">25</b></span></div>
    </section>

    <section class="character-stage">
      <div class="stage-glow"></div>
      <img class="castle-art" src="./assets/enchanted-castle.svg" alt="">
      <img class="character queen" id="queen" src="./assets/queen-luma.svg" alt="الملكة لوما">
      <div class="speech-bubble" id="characterMessage">مرحباً بك في مملكتي!</div>
      <img class="character dragon" id="dragon" src="./assets/dragon-prince.svg" alt="أمير التنين">
      <div class="stage-title"><span>✧</span> حدائق السكر السحرية <span>✧</span></div>
    </section>

    <section class="mission-row">
      <div class="mission-icon">🎯</div>
      <div class="mission-copy"><small>هدف المرحلة</small><strong>اجمع <b id="targetScore">1,500</b> نقطة</strong></div>
      <div class="score-box"><small>نقاطك</small><strong id="score">0</strong></div>
    </section>

    <section class="board-wrap" aria-label="لوحة الحلوى">
      <div class="board-rim">
        <canvas id="renderCanvas" touch-action="none"></canvas>
        <div class="board-loading" id="loading">جاري تجهيز عالم الحلوى...</div>
      </div>
      <div class="board-sparkle sparkle-one">✦</div><div class="board-sparkle sparkle-two">✧</div>
    </section>

    <section class="bottom-panel">
      <div class="booster-heading"><span>⚡</span> مساعدات سحرية <span>⚡</span></div>
      <div class="boosters">
        <button class="booster" id="hammerBtn"><span class="booster-art hammer">🔨</span><b>مطرقة السكر</b><small>3</small></button>
        <button class="booster" id="shuffleBtn"><span class="booster-art shuffle">🔀</span><b>خلطة سحرية</b><small>∞</small></button>
        <button class="booster" id="movesBtn"><span class="booster-art extra">＋5</span><b>حركات إضافية</b><small>2</small></button>
      </div>
      <div class="bottom-actions">
        <button id="restartBtn" class="soft-button">↻ إعادة المرحلة</button>
        <button id="nextBtn" class="primary-button" disabled>المرحلة التالية <span>➜</span></button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal hidden" id="resultModal">
    <div class="modal-card">
      <div class="modal-crown">♛</div>
      <h2 id="resultTitle">أحسنت!</h2>
      <p id="resultText">لقد أنقذت الحديقة السحرية.</p>
      <div class="result-stars">⭐ ⭐ ⭐</div>
      <button id="resultButton" class="primary-button">استمرار</button>
    </div>
  </div>
  <script src="./game.js"></script>
</body>
</html>
