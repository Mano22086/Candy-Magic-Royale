name: Deploy web game to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game JavaScript
        run: node --check game.js
      - name: Convert candy artwork to PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets = Path('assets')
          files = sorted(assets.glob('candy_basic_*.jpg')) + [assets / 'candy_special_1.jpg']
          for source in files:
              if source.exists():
                  target = source.with_suffix('.png')
                  with Image.open(source) as image:
                      image.convert('RGBA').save(target, format='PNG', optimize=True)
                  print(f'Converted {source} -> {target}')
          PY
      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
